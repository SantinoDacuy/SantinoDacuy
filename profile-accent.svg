<svg width="1200" height="190" viewBox="0 0 1200 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hello World presentation for Santino Dacuy</title>
  <desc id="desc">A terminal-inspired presentation card for Santino Dacuy, systems analyst focused on backend, databases, and business intelligence.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A22"/>
      <stop offset="0.5" stop-color="#0B2630"/>
      <stop offset="1" stop-color="#102B48"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDAE"/>
      <stop offset="0.5" stop-color="#70A5FD"/>
      <stop offset="1" stop-color="#38BDAE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#70A5FD" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#38BDAE" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="1184" height="174" rx="14" fill="url(#panel)" stroke="url(#edge)" stroke-opacity="0.8" filter="url(#shadow)"/>
  <rect x="8" y="8" width="1184" height="174" rx="14" fill="url(#grid)"/>
  <path d="M30 48H1170" stroke="#70A5FD" stroke-opacity="0.18"/>
  <circle cx="34" cy="29" r="5" fill="#FF6B6B"/>
  <circle cx="52" cy="29" r="5" fill="#F2C94C"/>
  <circle cx="70" cy="29" r="5" fill="#38BDAE"/>
  <text x="98" y="34" fill="#8CA4B8" font-family="monospace" font-size="14">santino@portfolio:~</text>
  <text x="42" y="82" fill="#38BDAE" font-family="monospace" font-size="16">&gt; echo "Hello, World!"</text>
  <text x="42" y="120" fill="#E6EDF3" font-family="monospace" font-size="34" font-weight="700">Santino Dacuy</text>
  <text x="44" y="148" fill="#70A5FD" font-family="monospace" font-size="17">Analista en Sistemas de Informacion</text>
  <text x="44" y="170" fill="#8CA4B8" font-family="monospace" font-size="14">Backend  /  Databases  /  Business Intelligence</text>
  <path d="M900 120L954 86L1006 120L1058 86L1112 120" stroke="#38BDAE" stroke-opacity="0.65" stroke-width="2"/>
  <circle cx="900" cy="120" r="4" fill="#70A5FD"/>
  <circle cx="954" cy="86" r="4" fill="#38BDAE"/>
  <circle cx="1006" cy="120" r="4" fill="#70A5FD"/>
  <circle cx="1058" cy="86" r="4" fill="#38BDAE"/>
  <circle cx="1112" cy="120" r="4" fill="#70A5FD"/>
</svg>
