<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Santino Dacuy - Hello World</title>
  <desc id="desc">Personal introduction for Santino Dacuy, Information Systems Analyst focused on backend, databases, and business intelligence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06151D"/>
      <stop offset="0.52" stop-color="#0A2430"/>
      <stop offset="1" stop-color="#112846"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDAE"/>
      <stop offset="0.5" stop-color="#70A5FD"/>
      <stop offset="1" stop-color="#38BDAE"/>
    </linearGradient>
    <linearGradient id="glow" x1="780" y1="30" x2="1100" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70A5FD" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38BDAE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1045 125) rotate(90) scale(100 150)">
      <stop stop-color="#F2C94C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2C94C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#70A5FD" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#38BDAE" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="1184" height="244" rx="16" fill="url(#background)" stroke="url(#border)" stroke-opacity="0.85" filter="url(#shadow)"/>
  <rect x="8" y="8" width="1184" height="244" rx="16" fill="url(#grid)"/>
  <circle cx="1000" cy="112" r="160" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="1045" cy="125" rx="150" ry="100" fill="url(#lampGlow)">
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M1055 116L780 202H1110L1055 116Z" fill="#F2C94C" fill-opacity="0.045">
    <animate attributeName="fill-opacity" values="0.02;0.07;0.02" dur="4s" repeatCount="indefinite"/>
  </path>

  <path d="M32 52H1168" stroke="#70A5FD" stroke-opacity="0.18"/>
  <circle cx="36" cy="30" r="5" fill="#FF6B6B"/>
  <circle cx="54" cy="30" r="5" fill="#F2C94C"/>
  <circle cx="72" cy="30" r="5" fill="#38BDAE"/>
  <text x="100" y="35" fill="#8CA4B8" font-family="monospace" font-size="14">santino@portfolio:~</text>

  <text x="48" y="91" fill="#38BDAE" font-family="monospace" font-size="17">&gt; echo "Hello, World!"</text>
  <circle cx="318" cy="85" r="3" fill="#38BDAE" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="137" fill="#E6EDF3" font-family="monospace" font-size="38" font-weight="700">Santino Dacuy</text>
  <text x="50" y="168" fill="#70A5FD" font-family="monospace" font-size="17">Analista en Sistemas de Informacion</text>
  <text x="50" y="195" fill="#B8C7D9" font-family="monospace" font-size="15">Backend   /   Databases   /   Business Intelligence</text>
  <text x="50" y="226" fill="#38BDAE" font-family="monospace" font-size="14">status: open_to_work = true</text>
  <rect x="294" y="216" width="9" height="9" rx="4.5" fill="#38BDAE">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
  </rect>

  <text x="848" y="94" fill="#8CA4B8" font-family="monospace" font-size="13">SELECT * FROM skills;</text>
  <text x="848" y="118" fill="#38BDAE" font-family="monospace" font-size="13">3 focus areas</text>
  <path d="M1110 79L1075 111" stroke="#B8C7D9" stroke-width="5" stroke-linecap="round"/>
  <path d="M1110 79L1140 57" stroke="#B8C7D9" stroke-width="5" stroke-linecap="round"/>
  <path d="M1060 105L1080 78L1142 78L1158 105H1060Z" fill="#F2C94C" fill-opacity="0.9" stroke="#FFF4BF" stroke-width="2"/>
  <path d="M1067 105H1151" stroke="#FFF4BF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1108" cy="108" r="6" fill="#FFF4BF">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M1110 111V183" stroke="#B8C7D9" stroke-width="4" stroke-linecap="round"/>
  <path d="M1110 183L1074 218H1146L1110 183Z" fill="#102B48" stroke="#70A5FD" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1008" y="242" fill="#F2C94C" font-family="monospace" font-size="12">focus_light = on</text>
</svg>
