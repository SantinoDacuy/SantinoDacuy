<svg width="240" height="190" viewBox="0 0 240 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ambient desk lamp</title>
  <desc id="desc">A small warm desk lamp illuminating the profile projects section.</desc>
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 72) rotate(90) scale(105 125)">
      <stop stop-color="#F2C94C" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F2C94C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="82" y1="38" x2="165" y2="93" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8E7A1"/>
      <stop offset="1" stop-color="#D6A72A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <ellipse cx="120" cy="82" rx="112" ry="88" fill="url(#halo)">
    <animate attributeName="opacity" values="0.45;0.72;0.58;0.45" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M120 73L34 169H208L120 73Z" fill="#F2C94C" fill-opacity="0.045">
    <animate attributeName="fill-opacity" values="0.025;0.05;0.035;0.025" dur="8s" repeatCount="indefinite"/>
  </path>

  <g fill="#FFF4BF">
    <circle cx="54" cy="112" r="1.5" opacity="0.25">
      <animate attributeName="cy" values="112;102;112" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.45;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="132" r="1" opacity="0.2">
      <animate attributeName="cy" values="132;120;132" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.35;0.08" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="148" r="1.2" opacity="0.18">
      <animate attributeName="cx" values="82;70;82;91;82" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="148;136;122;136;148" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.4;0.18;0.35;0.05" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="158" r="1.3" opacity="0.16">
      <animate attributeName="cx" values="148;158;170;158;148" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="158;143;130;143;158" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.04;0.32;0.12;0.28;0.04" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="108" cy="132" r="0.9" opacity="0.2">
      <animate attributeName="cy" values="132;116;104;116;132" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.06;0.3;0.5;0.3;0.06" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="196" cy="154" r="0.8" opacity="0.15">
      <animate attributeName="cx" values="196;188;178;188;196" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="154;140;126;140;154" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.04;0.25;0.1;0.22;0.04" dur="8.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M88 68L151 68" stroke="#FFF4BF" stroke-width="3" stroke-linecap="round" stroke-opacity="0">
    <animate attributeName="stroke-opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
  </path>

  <g id="lamp-head" transform="translate(0 0) rotate(0 120 145)">
  <path d="M120 76V145" stroke="#B8C7D9" stroke-width="5" stroke-linecap="round"/>
  <path d="M120 145L81 173H159L120 145Z" fill="#102B48" stroke="#70A5FD" stroke-opacity="0.9" stroke-width="2"/>
  <path d="M74 71L94 37H146L166 71H74Z" fill="url(#shade)" stroke="#FFF4BF" stroke-width="2"/>
  <path d="M82 71H158" stroke="#FFF4BF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="75" r="7" fill="#FFF4BF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.55;0.82;0.68;0.55" dur="5s" repeatCount="indefinite"/>
  </circle>
  <path d="M94 37L83 22M146 37L157 22" stroke="#70A5FD" stroke-opacity="0.65" stroke-width="2"/>
  <circle cx="83" cy="22" r="3" fill="#38BDAE"/>
  <circle cx="157" cy="22" r="3" fill="#38BDAE"/>
  </g>
  <text x="75" y="188" fill="#8CA4B8" font-family="monospace" font-size="12">ambient light</text>
</svg>
